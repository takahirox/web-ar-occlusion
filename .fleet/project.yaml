schema_version: 2
commands:
  diff-check:
    argv: ["git", "diff", "--check", "HEAD", "--"]
    cwd: "."
  core-test:
    argv: ["node", "--test"]
    cwd: "packages/core"
  demo-test:
    argv: ["node", "--test", "apps/demo/test/*.test.mjs"]
    cwd: "."
evaluators:
  - id: patch-integrity
    provider_id: process.harness
    command_ref: diff-check
    criterion_ids: [patch-is-well-formed]
rules: []
paths:
  writable: ["README.md", "docs/**", "package.json", "tsconfig.json", "apps/demo/**", "scripts/serve-demo.mjs", "packages/core/**", "packages/depth-webgpu/**", "packages/depth-webxr/**", "packages/motion/**", "packages/three/**", "packages/babylon/**"]
  protected: [".git/**", ".fleet/**", ".env*", ".github/workflows/**"]
  generated: []
verification:
  required: ["diff-check"]
  required_evaluators: ["patch-integrity"]
  evidence_freshness: "exact_diff"
  review:
    required: true
    block_severities: ["critical", "high"]
network:
  mode: "disabled"
  https_domains: []
  ports: []
install:
  ecosystems: []
  existing_lock: "deny"
  new_dependency: "deny"
  manifest_lock_mutation: "deny"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  host_global: "deny"
approvals:
  process_shell: "required"
  new_dependency: "required"
  manifest_lock_mutation: "required"
  lifecycle_scripts: "deny"
  new_registry_domain: "required"
  promotion: "required"
worker:
  preferred: "codex_cli"
  allowed: ["codex_cli"]
  allowed_strategy_ids: ["codex-luna-max", "codex-sol-high"]
  adaptive_routing: true
  local_backend: false
budgets:
  wall_seconds: 1800.0
  worker_turns: 1
  processes: 20
  download_bytes: 0
  artifact_bytes: 50000000
